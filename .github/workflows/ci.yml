name: CI

# Standard runners, so no macOS and no libcompression: the Apple-parity
# checks and the CBMC proofs (harness/proofs, too memory-hungry for a free
# runner) are local pre-release steps instead. See CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Conformance binaries and fixtures. An exact hit means no C input
      # changed, so the objects are touched to look newer than the fresh
      # checkout and make skips the rebuild. A partial hit only carries the
      # previous run's test timings, which order the slowest tests first.
      - name: Restore conformance build
        id: cbuild
        uses: actions/cache@v4
        with:
          path: harness/build
          key: conformance-${{ runner.os }}-${{ hashFiles('crates/*/csrc/**', 'harness/conformance/**', 'harness/core/**', 'harness/flags.mk', 'harness/Makefile', 'harness/tools/**') }}
          restore-keys: conformance-${{ runner.os }}-
      - name: Mark cached build current
        if: steps.cbuild.outputs.cache-hit == 'true'
        run: find harness/build -exec touch {} +
      # The C conformance suite. check-quick, not check: it shrinks the
      # fixtures and bounds the slowest sweep rather than dropping tests,
      # because a free runner is slow at the optimal-parse DP.
      - run: make -C harness check-quick
      - name: Verify fuzz sanitizer enforcement
        run: |
          CC=clang harness/fuzz/verify.sh asan
          CC=clang harness/fuzz/verify.sh msan

  # No codec library may include an Apple header — only the benches may.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Apple headers in codec sources
        run: |
          if grep -rn 'compression\.h\|TargetConditionals\|CoreFoundation' \
               crates/*/csrc/; then
            echo "::error::codec C sources must stay portable"
            exit 1
          fi

  # Free for public repositories; uncommenting moves the Apple oracle run
  # out of the manual pre-release steps and into CI.
  # macos:
  #   runs-on: macos-14
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - uses: Swatinem/rust-cache@v2
  #     - run: cargo test --workspace
  #     - run: make -C harness check-quick
